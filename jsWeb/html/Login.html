<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/Style.css">
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="icon" type="image/png" href="../resources/logoAnvil.png">
</head>

<body>

    <!-- Formulario -->
    <main>
        <form>
            <img src="../resources/logoAnvil.png" alt="Logo de Anvil">
            <span>ANVIL</span>
            <h1>Inicia sesión</h1>

            <label for="usuario">Nombre de la cuenta</label>
            <input type="text" id="usuario" name="usuario" placeholder="Escriba el nombre de la cuenta" required>

            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" placeholder="Escriba la contraseña" required>

            <p  id="mensajeError"></p>

            <button type="submit">Iniciar sesión</button>
            <!-- Pequeno evento de js para cerrar pestana -->
            <button type="button" onclick="window.close()">Cerrar</button>
        </form>
    </main>

    <!-- Aside para imagen -->
    <aside></aside>

    <!--Elaces a los scripts-->
    <script src="../js/Script.js"></script>
    <script src="../js/Login.js"></script>

</body>

</html>
